<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GaragemHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="page">
    <div class="mouse-glow"></div>

    <div class="home">
        <div class="home-logo">🚗</div>
        <h1>GaragemHub</h1>
        <p class="subtitle">API + UI para gerenciar personagens e seus veículos icônicos</p>

        <div class="home-links">
            <a th:href="@{/personagens/ui/listar}" class="home-card">
                <span class="icon">🦸</span>
                <span>Personagens</span>
            </a>
            <a th:href="@{/carros/ui/listar}" class="home-card">
                <span class="icon">🏎️</span>
                <span>Carros</span>
            </a>
            <a th:href="@{/swagger-ui.html}" class="home-card">
                <span class="icon">📚</span>
                <span>Swagger</span>
            </a>
            <a th:href="@{/v3/api-docs}" class="home-card">
                <span class="icon">📄</span>
                <span>OpenAPI</span>
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
